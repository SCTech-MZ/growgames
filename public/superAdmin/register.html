<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grow Games - Login</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-logo">GG</div>
        <h1 class="login-title">Grow Games</h1>
        <p class="login-subtitle">Painel de Gestão - Lan House</p>

        <div class="error-message" id="errorMsg"></div>

        <div class="form-group">
            <label>Nome</label>
            <input type="text" id="nome" placeholder="Julinho Herminio ..." required>
        </div>

        <div class="form-group">
            <label>E-mail</label>
            <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required>
        </div>

        <div class="form-group">
            <label>Senha</label>
            <input type="password" id="password" placeholder="Sua senha" autocomplete="current-password" required >
        </div>

        <button class="btn-login" id="btnLogin">
            <span class="btn-text">Cadastrar</span>
            <div class="spinner"></div>
        </button>
    </div>

    <script src="../js/Api.js"></script>
    <script src="../js/register.js"></script>
</body>
</html>
