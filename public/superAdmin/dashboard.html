<!DOCTYPE html>
<html lang='pt-BR'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Grow Games - super admin</title>
    <link rel='stylesheet' href='../css/base.css'>
    <link rel='stylesheet' href='../css/animations.css'>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">GG</div>
            <div class="sidebar-title">Grow Games</div>
        </div>
        <nav class="sidebar-nav">
            <a href="#" data-page="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="spanMobile">Dashboard</span></a>
            <a href="#" data-page="aparelhos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span class="spanMobile">Aparelhos</span></a>
            <a href="#" data-page="energia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg><span class="spanMobile">Energia</span></a>
            <a href="#" data-page="jogos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="14.31" y1="8" x2="20.05" y2="17.94"/><line x1="9.69" y1="8" x2="3.95" y2="17.94"/><line x1="12" y1="18" x2="12" y2="18.01"/></svg><span class="spanMobile">Jogos</span></a>
            <a href="#" data-page="financeiro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span class="spanMobile">Financeiro</span></a>
            <a href="./register.html"><span class="spanMobile">Cadastrar usuario</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="avatar" id="avatarInicial">SA</div>
            <div class="user-info">
                <div class="name" id="nomeUsuario">Super Admin</div>
                <div class="role">Proprietario</div>
            </div>
        </div>
    </aside>
    <main class="main">
        <header class="header">
            <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="6" width="18" height="2" rx="1" fill="currentColor"/>
        <rect x="3" y="11" width="18" height="2" rx="1" fill="currentColor"/>
        <rect x="3" y="16" width="18" height="2" rx="1" fill="currentColor"/></svg>
            </button>
            <h1 id="pageTitle">Dashboard</h1>
            <div class="header-actions">
                <button class="notification-bell" id="notifBell" onclick="mostrarNotificacoes()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg><span class="badge hiden" id="notifBadge">0</span></button>
                <button class="btn btn-outline btn-sm" onclick="logout()">Sair</button>
            </div>
        </header>
        <div class="content" id="contentArea"></div>

        <div class="modal-overlay hidden" id="modalOverlay">
            <div class="modal" id="modalContent"></div>
        </div>

        <div class="toast-container" id="toastContainer"></div>
    </main>
    <script src="../js/Api.js"></script>
    <script src="../js/superAdmin.js"></script>
</body>
</html>
