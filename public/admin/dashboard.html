<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grow Games - Admin</title>
    <link rel="stylesheet" href="../css/base.css">
    <style>
        .quick-report {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 20px;
            margin-top: 20px;
        }

        .quick-report h3 {
            color: #fff;
            margin-bottom: 16px;
            font-size: 15px;
        }

        .quick-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: end;
        }

        .quick-form .form-group-modal {
            flex: 1;
            min-width: 150px;
            margin-bottom: 0;
        }

        .energy-meter {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            grid-column: span 2;
        }

        .energy-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 6px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            transition: 0.3s ease;
        }

        .energy-circle.low { border-color: var(--danger); color: var(--danger); animation: glowPulse 1.5s ease-in-out infinite; }
        .energy-circle.mid { border-color: var(--warning); color: var(--warning); }
        .energy-circle.good { border-color: var(--accent); color: var(--accent); }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">GG</div>
            <div class="sidebar-title">Grow Games<small>Admin</small></div>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="active" data-page="dashboard"> Dashboard</a>
            <a href="#" data-page="jogos"> Jogos do Dia</a>
            <a href="#" data-page="energia"> Energia</a>
            <a href="#" data-page="aparelhos"> Aparelhos</a>
        </nav>
        <div class="sidebar-footer">
            <div class="avatar" id="avatarInicial">AD</div>
            <div class="user-info">
                <div class="name" id="nomeUsuario">Admin</div>
                <div class="role">Funcionário</div>
            </div>
        </div>
    </aside>

    <div class="main">
        <header class="header">
            <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">&bigstar;</button>
            <h1 id="pageTitle">Dashboard</h1>
            <div class="header-actions">
                <button class="notification-bell" id="notifBell" onclick="mostrarNotificacoes()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg><span class="badge hidden" id="notifBadge">0</span>
                </button>
                <button class="btn btn-outline btn-sm" onclick="logout()">Sair</button>
            </div>
        </header>

        <div class="content" id="contentArea">
        </div>
    </div>

    <div class="modal-overlay hidden" id="modalOverlay">
        <div class="modal" id="modalContent"></div>
    </div>

    <!-- Toast Container (nft) -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
